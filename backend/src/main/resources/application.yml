server:
  port: 8080

spring:
  application:
    name: civil-service-assistance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
#  main:
#    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    auto-mapping-behavior: partial
    map-underscore-to-camel-case: true

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: ${JWT_SECRET} # 必须通过环境变量或环境配置提供
  expiration: 1800 #Access Token超时(30分钟)
  tokenHead: 'Bearer '  #JWT负载中拿到开头
  refreshExpiration: 604800 #Refresh Token超时(7天)

redis:
  database: civil-service-assistance
  key:
    admin: 'ums:admin'
    resourceList: 'ums:resourceList'
  expire:
    common: 86400 # 24小时

secure:
  ignored:
    urls: #安全路径白名单
      - /swagger-ui/
      - /swagger-resources/**
      - /**/v2/api-docs
      - /**/*.html
      - /**/*.js
      - /**/*.css
      - /**/*.png
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /admin/login
      - /admin/register
      - /admin/forgot/**
      - /admin/info
      - /admin/logout
      - /admin/refresh
      - /admin/captcha
      - /admin/login-by-code
      - /admin/register/send-code
      - /admin/send-login-code

deepseek:
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat

ingestion:
  national:
    enabled: ${NATIONAL_INGESTION_ENABLED:false}
    year: ${NATIONAL_EXAM_YEAR:2026}
    seed-url: ${NATIONAL_EXAM_SOURCE_URL:https://bm.scs.gov.cn/kl2026}
    allowed-hosts: ${NATIONAL_SOURCE_HOSTS:bm.scs.gov.cn,scs.gov.cn,www.scs.gov.cn}
    archive-dir: ${NATIONAL_ARCHIVE_DIR:./data/official-archives}
    cron: ${NATIONAL_INGESTION_CRON:0 30 3 * * *}
  ai:
    api-key: ${INGESTION_AI_API_KEY:}
